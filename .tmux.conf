# Better prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits that make sense (keep current path)
bind Up     split-window -v -c "#{pane_current_path}"
bind Down   split-window -v -c "#{pane_current_path}"
bind Right  split-window -h -c "#{pane_current_path}"
bind Left   split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation, no prefix needed
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane navigation — arrow keys (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# Resize panes with prefix + HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Mouse support (resize/select by click, optional but nice)
set -g mouse on

# Start windows/panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Faster escape (better vim experience inside)
set -sg escape-time 0

# More scrollback
set -g history-limit 50000

# 256 color / true color
set -g default-terminal "tmux-256color"

## # Status bar customization
## set -g status-bg black
## set -g status-fg white
## set -g status-left-length 40
## set -g status-right-length 100
## set -g status-left "#[fg=green]#H"

# disable status bar
set -g status off

# # Reload config file with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# enable scrolling with mouse wheel
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "copy-mode -e; send-keys -M" "send-keys -M"
bind -n WheelDownPane select-pane -t= \; send-keys -M
